name: Repaint profile

# Every night the header gets a fresh canvas (seeded by the date), and the
# open-source strokes and contribution year are redrawn from the GitHub API.
on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      - run: node paint.mjs
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the new canvas
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets tools/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: repaint profile"
          git push
